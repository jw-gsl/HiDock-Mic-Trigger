name: hidock-mic-trigger
options:
  bundleIdPrefix: com.hidock.tools
  deploymentTarget:
    macOS: 13.0
settings:
  MARKETING_VERSION: 1.0.0
  CURRENT_PROJECT_VERSION: 1
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.13.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
schemes:
  hidock-mic-trigger:
    build:
      targets:
        hidock-mic-trigger: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - hidock-mic-trigger-tests
targets:
  hidock-mic-trigger:
    type: application
    platform: macOS
    dependencies:
      - package: SwiftTerm
      - package: MarkdownUI
        product: MarkdownUI
    preBuildScripts:
      - name: "Run Python Tests"
        script: |
          cd "$SRCROOT/../usb-extractor"
          if [ -f ".venv/bin/python" ]; then
            .venv/bin/python -m pytest tests/ --tb=short -q
          else
            echo "warning: Python venv not found, skipping extractor tests"
          fi
          cd "$SRCROOT/../transcription-pipeline"
          if [ -f ".venv/bin/python" ]; then
            .venv/bin/python -m pytest tests/ --tb=short -q
          else
            echo "warning: transcription-pipeline venv not found, skipping tests"
          fi
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: "Deploy to Applications"
        script: |
          set -euo pipefail

          # Deployment is opt-in.
          #
          # This phase has `basedOnDependencyAnalysis: false`, so it runs on *every*
          # build of the app target. While deploying was the default, that meant any
          # incidental build — a validation compile, a test run, an IDE build, a hook
          # — popped an approval dialog, and they arrived in bursts. Requiring an
          # explicit `HIDOCK_DEPLOY=1` makes the intent unambiguous and silences
          # every build that never meant to touch the installed app. Typing the
          # variable *is* the deliberate approval, and unlike a dialog it cannot be
          # click-fatigued into a yes — which is how a deploy killed an in-flight
          # re-diarisation on 2026-07-28.
          if [ "${HIDOCK_DEPLOY:-}" != "1" ] && [ "${HIDOCK_DEPLOY:-}" != "force" ]; then
            echo "note: HIDOCK_DEPLOY not set — compiled only, installed app untouched"
            exit 0
          fi
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "note: GitHub Actions — never deploys"
            exit 0
          fi

          # Confirmation is only warranted when a running app is about to be quit and
          # relaunched. If it is not running there is nothing to interrupt, so asking
          # would be the same empty ceremony the old build-approval dialog was.
          APP_RUNNING="false"
          if /usr/bin/pgrep -f "/Applications/HiDock Mic Trigger.app" > /dev/null 2>&1; then
            APP_RUNNING="true"
          fi

          if [ "$APP_RUNNING" = "true" ] && [ "${HIDOCK_DEPLOY}" != "force" ]; then
            # Say what is actually running rather than warning unconditionally. The
            # warning used to claim every deploy "may interrupt active work", which
            # reads like a detection and is therefore ignored.
            BUSY_LIST=""
            add_busy() {
              if /usr/bin/pgrep -f "$1" > /dev/null 2>&1; then
                BUSY_LIST="${BUSY_LIST}${BUSY_LIST:+, }$2"
              fi
            }
            add_busy "transcribe(_parakeet|_cpp)?\.py" "transcription / re-diarisation"
            add_busy "usb-extractor.*extractor\.py" "a device download"
            add_busy "ffmpeg.*HiDock" "an audio conversion"
            add_busy "voice_training\.py" "voice-library training"
            # A live capture is the costliest thing to lose, and `ffmpeg.*HiDock`
            # cannot catch it: the trigger runs ffmpeg as `-f avfoundation -i :<n>`
            # with no "HiDock" in its arguments.
            add_busy "ffmpeg.*avfoundation" "a live recording (the mic trigger is holding the HiDock input open)"

            if [ -n "$BUSY_LIST" ]; then
              DIALOG_TEXT="HiDock is BUSY: ${BUSY_LIST}. Quitting and relaunching the app now will kill it mid-run and the work will be lost."
              DEFAULT_BUTTON="Cancel"
            else
              DIALOG_TEXT="The app is running and will be quit and relaunched. Nothing is transcribing, downloading, converting or recording."
              DEFAULT_BUTTON="Quit and Replace"
            fi

            # A dialog from a process xcodebuild spawned opens without focus, so the
            # first click is spent activating the window. `tell me to activate` did
            # not fix that, so the dialog is owned by System Events, which can bring
            # itself frontmost. If this still needs two clicks, the next step is a
            # Finder-owned dialog rather than another variant of the same trick.
            set +e
            DEPLOY_APPROVED=$(/usr/bin/osascript \
              -e 'tell application "System Events" to activate' \
              -e "tell application \"System Events\" to display dialog \"$DIALOG_TEXT\" buttons {\"Cancel\", \"Quit and Replace\"} default button \"$DEFAULT_BUTTON\" cancel button \"Cancel\" with title \"Replace the running HiDock app\"" \
              -e 'button returned of the result' 2>/tmp/hidock-dialog.err)
            DIALOG_STATUS=$?
            set -e
            if [ "$DEPLOY_APPROVED" != "Quit and Replace" ]; then
              # Distinguish a decision from a failure. Swallowing both as "cancelled"
              # meant a dialog that never appeared looked exactly like a deliberate
              # Cancel, so there was no way to tell whether the approval flow was
              # even working.
              if [ "$DIALOG_STATUS" -ne 0 ] && [ -z "$DEPLOY_APPROVED" ]; then
                echo "note: the approval dialog could not be shown (osascript exit $DIALOG_STATUS); nothing was deployed"
                echo "note: $(head -c 300 /tmp/hidock-dialog.err 2>/dev/null)"
                echo "note: use HIDOCK_DEPLOY=force to deploy without the dialog"
              else
                echo "note: Deployment cancelled by the reviewer; the installed app was not changed"
              fi
              exit 0
            fi
          fi

          APP_NAME="HiDock Mic Trigger.app"
          INSTALL_DIR="/Applications"
          # Build output name may differ from the install name; find the .app.
          BUILT_APP=$(find "$BUILT_PRODUCTS_DIR" -maxdepth 1 -name "*.app" -type d | head -1)

          if [ -z "$BUILT_APP" ] || [ ! -d "$BUILT_APP" ]; then
            echo "error: Built app not found under $BUILT_PRODUCTS_DIR"
            exit 1
          fi

          # A stable Developer ID identity is required for local installs.
          # Ad-hoc signing changes the designated requirement on every build,
          # so Keychain "Always Allow" approvals cannot persist.
          SIGN_ID="${HIDOCK_SIGNING_IDENTITY:-}"
          if [ -z "$SIGN_ID" ]; then
            SIGN_ID=$(security find-identity -v -p codesigning 2>/dev/null \
              | awk -F'"' '/Developer ID Application:/ {print $2; exit}')
          fi
          case "$SIGN_ID" in
            "Developer ID Application:"*) ;;
            *)
              echo "error: no valid Developer ID Application identity found"
              echo "       Install the certificate/private key or set HIDOCK_SIGNING_IDENTITY."
              exit 1
              ;;
          esac

          # Sign and verify a staged copy before replacing the live app. A
          # failed signing operation must not leave an unsigned/broken install.
          STAGE_DIR=$(mktemp -d "${TMPDIR:-/tmp}/hidock-install.XXXXXX")
          trap 'rm -rf "$STAGE_DIR"' EXIT
          STAGED_APP="$STAGE_DIR/$APP_NAME"
          cp -R "$BUILT_APP" "$STAGED_APP"
          echo "Signing with: $SIGN_ID"
          codesign --force --deep --sign "$SIGN_ID" "$STAGED_APP"
          codesign --verify --deep --strict --verbose=2 "$STAGED_APP"

          # Kill running instance only after the replacement has been signed.
          pkill -f "hidock-mic-trigger" 2>/dev/null || true
          sleep 1

          # Remove stale copies (including the legacy Dev.app split, the old
          # lowercase bundle name, and the old per-user install location).
          rm -rf "$INSTALL_DIR/$APP_NAME"
          rm -rf "$INSTALL_DIR/HiDock Mic Trigger Dev.app"
          rm -rf "$INSTALL_DIR/hidock-mic-trigger.app"
          rm -rf "$HOME/Applications/$APP_NAME"
          rm -rf "$HOME/Applications/HiDock Mic Trigger Dev.app"

          cp -R "$STAGED_APP" "$INSTALL_DIR/$APP_NAME"
          codesign --verify --deep --strict --verbose=2 "$INSTALL_DIR/$APP_NAME"
          /System/Library/Frameworks/CoreServices.framework/Versions/Current/Frameworks/LaunchServices.framework/Versions/Current/Support/lsregister -f "$INSTALL_DIR/$APP_NAME"

          open -a "$INSTALL_DIR/$APP_NAME"
          echo "Deployed signed $APP_NAME ($CONFIGURATION) to $INSTALL_DIR"
        basedOnDependencyAnalysis: false
    sources:
      - Sources
      - Assets.xcassets
    settings:
      INFOPLIST_KEY_LSUIElement: YES
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "This app launches hidock-mic-trigger to keep the HiDock mic active when your USB mic is in use."
      PRODUCT_NAME: HiDock Mic Trigger
      EXECUTABLE_NAME: hidock-mic-trigger
      # Debug and Release share bundle id, icon, and install location so there
      # is only ever one "HiDock Mic Trigger.app" on the machine. Debug still
      # gets the DEBUG compile flag (standard for SwiftUI #if DEBUG checks).
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.hidock.tools.hidock-mic-trigger
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    info:
      path: Info.plist
      properties:
        CFBundleName: HiDock Mic Trigger
        CFBundleDisplayName: HiDock Mic Trigger
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: hidock-mic-trigger
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSMicrophoneUsageDescription: "This app launches hidock-mic-trigger to keep the HiDock mic active when your USB mic is in use."
        # EventKit matches a recording to its meeting. macOS 14+ asks for the
        # full-access key; the legacy key is still required on earlier systems
        # because the app falls back to requestAccess(to:) there.
        NSCalendarsFullAccessUsageDescription: "HiDock uses your calendar only to match a recording with its meeting and improve speaker diarisation."
        NSCalendarsUsageDescription: "HiDock uses your calendar only to match a recording with its meeting and improve speaker diarisation."
  hidock-mic-trigger-tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: hidock-mic-trigger
    # Host-less logic tests. macOS unit tests can @testable import the app
    # target without a running host app; a TEST_HOST pointing at the agent
    # app (LSUIElement) made `xcodebuild test` fail to resolve the host.
    settings:
      GENERATE_INFOPLIST_FILE: YES
