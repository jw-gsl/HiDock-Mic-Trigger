name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  python-usb-extractor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usb-extractor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest numpy
      - run: python -m pytest tests/ -v

  python-transcription-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transcription-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest numpy
      - run: python -m pytest tests/ -v

  python-windows-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Windows-App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest numpy
      - run: python -m pytest tests/ -v

  python-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest numpy scipy soundfile mutagen
      - run: python -m pytest shared/tests/ -v

  # The app has an XCTest target. Keep this as a test action rather than a
  # compile-only smoke check, so the Tests workflow exercises it on every PR.
  swift-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          cd hidock-mic-trigger
          xcodegen generate
      - name: Test Swift app (Debug)
        env:
          CI: "true"
        run: |
          cd hidock-mic-trigger
          # -arch arm64 + -destination=macOS would clash on newer xcodebuild
          # ("destination implies architecture, architecture must not also be
          # specified"). The macos-15 runner is arm64 so platform alone is
          # enough.
          xcodebuild test \
            -project hidock-mic-trigger.xcodeproj \
            -scheme hidock-mic-trigger \
            -configuration Debug \
            -derivedDataPath /tmp/hidock-test \
            -destination 'platform=macOS'

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Lint Python code
        # E402 (module import not at top) is intentional in files that
        # tweak sys.path before importing. E741 (`l` as variable name)
        # appears in numerical/clustering code where it's a conventional
        # short name. Ignored so the lint job catches real issues
        # (F-series pyflakes errors, W-series whitespace) rather than
        # signalling on accepted project style.
        run: ruff check --select E,F,W --ignore E501,E402,E741 .
